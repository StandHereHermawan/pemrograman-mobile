<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#FBEFE3"/>

  <style>
    .main-text {
      font-family: 'Brush Script MT', 'Cursive', 'Pacifico', sans-serif;
      fill: #D31236;
      font-size: 140px;
      font-weight: bold;
    }
    .sub-text {
      font-family: 'Brush Script MT', 'Cursive', 'Pacifico', sans-serif;
      fill: #D31236;
      font-size: 100px;
      font-weight: bold;
    }
    .tagline {
      font-family: 'Georgia', serif;
      fill: #444444;
      font-size: 30px;
      font-style: italic;
      letter-spacing: 1px;
    }
  </style>

  <g text-anchor="middle" transform="translate(250, 200)">
    <text x="0" y="0" class="main-text">Zweet</text>
    
    <text x="40" y="80" class="sub-text">corner</text>
    
    <text x="0" y="140" class="tagline">Handcrafted Cookies</text>
  </g>
</svg>