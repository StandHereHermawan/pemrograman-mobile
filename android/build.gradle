buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // ... dependencies lain ...
        
        // TAMBAHKAN BARIS INI:
        classpath 'com.google.gms:google-services:4.4.2' // Cek versi terbaru jika perlu
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
