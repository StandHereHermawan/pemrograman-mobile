name: roomify

services:
  mysql-db:
    image: mysql:8.2.0-1.el8
    ports:
      - protocol: tcp
        published: 3306
        target: 3306
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-db-volume:/var/lib/mysql
    networks:
      - network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 600m
        limits:
          cpus: "1"
          memory: 1g

  phpmyadmin:
    depends_on:
      mysql-db:
        condition: service_healthy
    image: phpmyadmin/phpmyadmin:5.2.2
    ports:
      - protocol: tcp
        published: 8080
        target: 80
    environment:
      # PMA_HOST now points to the new, shorter service name
      PMA_HOST: mysql-db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PMA_AUTH_TYPE: "config"
      PMA_USER: "root"
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - network
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 50m
        limits:
          cpus: "1"
          memory: 100m

